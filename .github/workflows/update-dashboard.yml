name: 更新分钟线看板

# ⚠️ 关于 cron 时区：GitHub Actions 的 cron 一律按 UTC 计算，不是北京时间。
# 北京时间 = UTC + 8，所以下表里写的是「北京时间减 8 小时」。
#
# 交易日时段（北京时间）-> 对应 UTC：
#   早盘  08:50-11:35  -> UTC 00:50-03:35
#   午盘  13:20-15:05  -> UTC 05:20-07:05
#   夜盘  20:50-23:05  -> UTC 12:50-15:05
#
# 用 */4 表示「每 4 分钟」，尽量压住免费 runner 的排队延迟。
# GitHub 对公开仓库的定时任务不计费；若仓库是私有的，每月 2000 分钟额度，
# 按每次约 1 分钟、每天约 130 次估算够用。嫌紧张就把 */4 改成 */10。
on:
  # 手动触发按钮（仓库页面 Actions 标签页 -> Run workflow）
  workflow_dispatch:

  schedule:
    - cron: "*/4 0-3 * * 1-5"      # 早盘
    - cron: "*/4 5-7 * * 1-5"      # 午盘
    - cron: "*/4 12-15 * * 1-5"    # 夜盘

permissions:
  contents: read       # 只读代码，不再往仓库里写产物
  pages: write         # 允许发布 Pages
  id-token: write      # OIDC，Pages 官方部署方式要求

# 同一时间只跑一个，避免两次部署打架；不取消正在跑的（宁可稍等）
concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # 把「今天要不要跑」暴露给 deploy job，
    # 这样非交易日时 deploy 可以跳过，不会把空产物发上去。
    outputs:
      should_run: ${{ steps.trading.outputs.should_run }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 本项目零第三方依赖（全是标准库 + 系统 curl），无需 pip install。
      - name: 环境自检
        run: |
          echo "Python: $(python --version)"
          echo "curl  : $(curl --version | head -1)"
          python -c "import json,re,subprocess,concurrent.futures,datetime; print('标准库 OK')"

      # 交易日检查：周末、法定节假日、长假前夜都直接跳过，
      # 避免白烧额度，也避免生成一份和上次一模一样的无意义部署。
      # 判断逻辑在 trading_calendar.py，本地计算，零网络开销。
      - name: 交易日检查
        id: trading
        run: |
          python - <<'PY'
          import os
          from datetime import datetime, timedelta, timezone
          from trading_calendar import session_trading_check

          # runner 是 UTC，这里显式换成北京时间再判断
          now = datetime.now(timezone(timedelta(hours=8))).replace(tzinfo=None)
          print(f"当前北京时间: {now:%Y-%m-%d %H:%M}")

          ok, reason = session_trading_check(now)
          print(f"判定: {'执行' if ok else '跳过'} —— {reason}")

          # 写进 GITHUB_OUTPUT，供后续步骤用 if 判断
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"should_run={'true' if ok else 'false'}\n")
          PY

      - name: 网络连通性自检
        if: steps.trading.outputs.should_run == 'true'
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 \
            -H "Referer: https://finance.sina.com.cn" \
            "https://hq.sinajs.cn/list=nf_P0" || echo "000")
          echo "新浪行情接口 HTTP = $code"
          if [ "$code" != "200" ]; then
            echo "::error::新浪接口不可达（HTTP $code）—— GitHub 的机器访问不了该行情源，"
            echo "::error::路线 1 走不通，需要改用云服务器方案。"
            exit 1
          fi

      - name: 生成看板
        if: steps.trading.outputs.should_run == 'true'
        run: |
          python build_dashboard.py    # 主看板：7 品种 + 4 价差，共 11 页
          python build_spread.py       # 月差专属页：P2701-P2705，单页

      - name: 校验产物
        if: steps.trading.outputs.should_run == 'true'
        run: |
          test -f dashboard.html      || { echo "缺少 dashboard.html"; exit 1; }
          test -f dashboard.data.json || { echo "缺少 dashboard.data.json"; exit 1; }
          test -f spread.html         || { echo "缺少 spread.html"; exit 1; }
          test -f spread.data.json    || { echo "缺少 spread.data.json"; exit 1; }

          python - <<'PY'
          import json

          # ---- 主看板 ----
          p = json.load(open('dashboard.data.json', encoding='utf-8'))
          pages = p.get('pages') or []
          print(f"[主看板] 生成时间: {p.get('generated_at')}   数据时间: {p.get('data_at')}")
          print(f"[主看板] 页面数  : {len(pages)}")
          assert len(pages) >= 10, f"页面数异常：{len(pages)}（应为 11 = 7 品种 + 4 价差）"
          sym = [x for x in pages if x['kind'] == 'symbol']
          itp = [x for x in pages if x['kind'] == 'interprice']
          print(f"[主看板]   品种页: {len(sym)}   价差页: {len(itp)}")
          empty = [x['code'] for x in pages if not (x.get('bars') or {})]
          assert not empty, f"这些页面没有任何图表数据：{empty}"

          # ---- 月差专属页 ----
          s = json.load(open('spread.data.json', encoding='utf-8'))
          sp = s.get('pages') or []
          print(f"[月差页] 生成时间: {s.get('generated_at')}   数据时间: {s.get('data_at')}")
          print(f"[月差页] 页面数  : {len(sp)}    single={s.get('single')}")
          assert len(sp) == 1, f"月差页应为 1 页，实际 {len(sp)}"
          assert sp[0].get('bars'), "月差页没有任何图表数据"
          bars = sp[0]['bars']
          print(f"[月差页] 图表周期: {sorted(bars.keys())}")
          assert len(bars) >= 5, f"月差页图表数偏少：{len(bars)}"
          print("产物校验通过（主看板 + 月差页）")
          PY

      # 只把「网站真正需要的文件」挑出来发布，避免把源码、data/（6MB+）
      # 一并传上 Pages —— 那会白白拖慢每次部署。
      - name: 准备 Pages 产物
        if: steps.trading.outputs.should_run == 'true'
        run: |
          mkdir -p public
          cp dashboard.html      public/index.html          # Pages 默认入口（主看板）
          cp dashboard.html      public/dashboard.html      # 保留原名，便于直接访问
          cp dashboard.data.json public/dashboard.data.json # 前端热更新用
          cp spread.html         public/spread.html         # 月差专属页（独立网址）
          cp spread.data.json    public/spread.data.json    # 月差页热更新用
          touch public/.nojekyll          # 阻止 Jekyll 处理，避免忽略下划线开头的文件
          echo "--- public/ 内容 ---"
          ls -la public/

      - name: 上传 Pages 产物
        if: steps.trading.outputs.should_run == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      # 非交易日时的说明（让日志里能一眼看出是主动跳过，不是失败）
      - name: 跳过说明
        if: steps.trading.outputs.should_run != 'true'
        run: |
          echo "::notice::今天不是交易日（或处于长假前夜无夜盘），已跳过本次更新。"
          echo "线上看板保持上一次交易日的结果不变。"

  deploy:
    needs: build
    # build 被跳过（非交易日）时不部署，避免把空产物发上去
    if: needs.build.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
